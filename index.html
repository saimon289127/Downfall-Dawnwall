<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14182E" />
  <title>Downfall — L'Assedio dell'Alba</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #14182E;
      font-family: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    #app-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14182E;
      overflow: hidden;
    }

    .bastion-flank {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 92%;
      width: 165px;
      margin: 0 18px;
      padding: 20px 12px;
      border: 2px solid #D97724;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(20, 24, 46, 0.94) 0%, rgba(30, 58, 95, 0.9) 50%, rgba(20, 24, 46, 0.96) 100%);
      box-shadow: 0 0 28px rgba(255, 176, 32, 0.25), inset 0 0 18px rgba(44, 232, 200, 0.14);
      color: #FFF3D1;
      text-align: center;
      pointer-events: none;
    }

    @media (min-aspect-ratio: 4/5) and (min-width: 760px) {
      #app-shell {
        background:
          radial-gradient(circle at 15% 25%, rgba(123, 63, 228, 0.28) 0%, transparent 45%),
          radial-gradient(circle at 85% 25%, rgba(44, 232, 200, 0.22) 0%, transparent 45%),
          radial-gradient(circle at 50% 80%, rgba(255, 176, 32, 0.25) 0%, transparent 55%),
          repeating-linear-gradient(
            45deg,
            #161B33 0px,
            #161B33 24px,
            #1B2240 24px,
            #1B2240 48px
          );
      }
      .bastion-flank {
        display: flex;
      }
    }

    .flank-crest {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid #FFB020;
      background: radial-gradient(circle, #FFB020 0%, #D97724 60%, #1E3A5F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 16px rgba(255, 176, 32, 0.6);
    }

    .flank-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #FFB020;
      margin-top: 8px;
    }

    .flank-lore {
      font-size: 11px;
      line-height: 1.45;
      color: #B8C0D0;
      padding: 8px 4px;
      border-top: 1px solid rgba(255, 176, 32, 0.3);
      border-bottom: 1px solid rgba(255, 176, 32, 0.3);
    }

    .flank-pillars {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flank-pill {
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(20, 24, 46, 0.85);
      border: 1px solid rgba(44, 232, 200, 0.35);
      font-size: 11px;
      color: #2CE8C8;
      font-weight: 700;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #game-container canvas {
      display: block;
      box-shadow: 0 0 42px rgba(0, 0, 0, 0.75), 0 0 2px #FFB020;
    }

    /* Full-bleed edge-to-edge on mobile phones (iPhone 16 Pro Max Safari & Android) */
    @media (max-width: 759px) {
      #game-container {
        width: 100vw;
        height: 100%;
      }
      #game-container canvas {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <aside class="bastion-flank" aria-hidden="true">
      <div>
        <div class="flank-crest">☀️</div>
        <div class="flank-title">DOWNFALL</div>
      </div>
      <div class="flank-lore">
        La Rocca del Sole resiste all'avanzata della Nebbia Notturna.
      </div>
      <div class="flank-pillars">
        <div class="flank-pill">⚔️ Difesa Bastione</div>
        <div class="flank-pill">🏰 Rocca &amp; Decreti</div>
        <div class="flank-pill">🗺️ 19 Terre nella Nebbia</div>
      </div>
    </aside>

    <div id="game-container"></div>

    <aside class="bastion-flank" aria-hidden="true">
      <div>
        <div class="flank-crest">🛡️</div>
        <div class="flank-title">BASTIONE</div>
      </div>
      <div class="flank-lore">
        Schiera Fanteria, Arcieri e Cavalleria per attivare la Sinergia di Formazione.
      </div>
      <div class="flank-pillars">
        <div class="flank-pill">🏹 5 Archetipi Torri</div>
        <div class="flank-pill">👑 6 Eroi dell'Alba</div>
        <div class="flank-pill">🔥 Ascensione Solare</div>
      </div>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
